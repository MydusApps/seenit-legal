<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <style>
    :root {
      --fg: #1a1a1a;
      --muted: #6b6b6b;
      --rule: #e5e5e5;
      --link: #0b66c2;
      --bg: #fdfdfd;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.6;
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
    }
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 48px 24px 96px;
    }
    nav.crumbs {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 32px;
    }
    nav.crumbs a { color: var(--muted); text-decoration: none; }
    nav.crumbs a:hover { color: var(--link); text-decoration: underline; }
    h1 {
      font-size: 28px;
      margin: 0 0 8px;
      line-height: 1.25;
      letter-spacing: -0.01em;
    }
    h2 {
      font-size: 20px;
      margin: 40px 0 12px;
      line-height: 1.3;
      padding-top: 8px;
    }
    h3 {
      font-size: 17px;
      margin: 28px 0 8px;
      line-height: 1.4;
    }
    p, li { font-size: 16px; }
    p { margin: 0 0 14px; }
    ul, ol { padding-left: 22px; margin: 0 0 14px; }
    li { margin-bottom: 6px; }
    a { color: var(--link); }
    strong { font-weight: 600; }
    hr { border: 0; border-top: 1px solid var(--rule); margin: 32px 0; }
    @media (max-width: 600px) {
      main { padding: 32px 18px 72px; }
      h1 { font-size: 24px; }
      h2 { font-size: 18px; }
    }
  </style>
</head>
<body>
  <main>
    {% unless page.url == "/" %}
      <nav class="crumbs"><a href="{{ '/' | relative_url }}">Seenit Legal</a></nav>
    {% endunless %}
    {{ content }}
  </main>
</body>
</html>
